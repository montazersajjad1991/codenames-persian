name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake and NDK via sdkmanager
        run: |
          yes | sdkmanager --licenses
          sdkmanager "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi
        continue-on-error: true

      - name: Collect APKs
        run: |
          mkdir -p apk-out
          find /home/runner/work -name "*.apk" -exec cp {} apk-out/ \;
          ls -la apk-out

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: apk-out/

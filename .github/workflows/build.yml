name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'  # ⬅️ تغییر به نسخه پایدارتر
          channel: 'stable'
          cache: true



      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons || true
          echo "=== Searching for APK files ==="
          find build -name "*.apk" 2>/dev/null || echo "No APK in build/"
          find android -name "*.apk" 2>/dev/null || echo "No APK in android/"
          ls -la build/app/outputs/apk/release/ 2>/dev/null || echo "release dir not found"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "flutter-apk dir not found"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codenames-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake and NDK via sdkmanager
        run: |
          yes | sdkmanager --licenses
          sdkmanager "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Clean build cache
        run: flutter clean

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Collect APKs
        run: |
          mkdir -p apk-out
          find build/app/outputs -name "*.apk" -exec cp {} apk-out/ \; || true
          find build/app/outputs/apk -name "*.apk" -exec cp {} apk-out/ \; || true
          ls -la apk-out
          if [ -z "$(ls -A apk-out/*.apk 2>/dev/null)" ]; then
            echo "No APK files found!"
            exit 1
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: apk-out/